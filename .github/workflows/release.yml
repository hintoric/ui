name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # npm's OIDC trusted publishing (no NPM_TOKEN secret) needs npm >= 11.5.1;
      # pin a version new enough regardless of what Node 24's runner image bundles.
      - name: Update npm for OIDC trusted publishing
        run: npm install -g npm@^11.6.2

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # changesets/action v1 targets @changesets/cli v2 and detects published
      # packages by scraping "New tag:" lines off the CLI's stdout. Our CLI is v3,
      # whose output no longer carries those lines, so v1 published to npm but then
      # pushed no git tags and cut no GitHub releases -- silently, with a green job.
      # v2 is the CLI-v3-compatible major: it reads CHANGESETS_OUTPUT instead, and
      # pushes tags plus releases through the GitHub API by default.
      - name: Create Release Pull Request or publish to npm
        uses: changesets/action@v2
        with:
          publish-script: pnpm release
          github-token: ${{ secrets.GITHUB_TOKEN }}
